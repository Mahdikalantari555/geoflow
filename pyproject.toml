[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow"
version = "0.0.1"
description = "Geospatial tensor operations built on Xarray"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "GeoFlow Contributors"},
]

keywords = ["geospatial", "remote-sensing", "machine-learning", "xarray", "pytorch"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core numerical
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",

    # Xarray ecosystem
    "xarray>=2022.6",
    "dask[array]>=2023.0",

    # Geospatial
    "rasterio>=1.3",
    "rioxarray>=0.14",
    "pyproj>=3.4",
    "affine>=2.4",
    "shapely>=2.0",

    # Deep learning (PyTorch required; TF, JAX optional)
    "torch>=2.0",

    # Unit registry
    "pint>=0.20",

    # Deep time support
    "cftime>=1.6",

    # Cloud storage
    "zarr>=2.16",
    "h5netcdf>=1.1",
    "netcdf4>=1.6",
    "s3fs>=2023.6",

    # STAC
    "pystac>=1.9",
    "pystac-client>=0.6",
    "requests>=2.28",

    # Visualization (optional but recommended)
    "matplotlib>=3.5",
    "hvplot>=0.8",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.10"]
jax = ["jax>=0.4"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "black>=23.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "numpydoc>=1.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["geoflow*"]
exclude = ["tests*", "test_*"]

[tool.setuptools.package-data]
geoflow = ["*.md", "*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
