# GeoFlow Conda Environment
# Reproducible environment with all dependencies
#
# Create:  conda env create -f environment.yaml
# Update:  conda env update -f environment.yaml
# Export:  conda env export > environment-lock.yaml
#
# Name: geoflow
# Python: 3.12

name: geoflow
channels:
  - conda-forge
dependencies:
  # Core Python
  - python>=3.12,<3.13
  - pip>=23.0

  # Core numerical
  - numpy>=1.26.4,<2.0
  - pandas>=2.0
  - scipy>=1.11

  # Xarray ecosystem
  - xarray>=2023.0
  - dask>=2023.0,<2024.0
  - distributed>=2023.0,<2024.0

  # Geospatial
  - rasterio>=1.3
  - rioxarray>=0.14
  - pyproj>=3.4
  - affine>=2.4
  - shapely>=2.0
  - gdal>=3.6

  # Deep learning (CUDA compatible)
  - pytorch>=2.0
  - torchvision>=0.15

  # Unit registry
  - pint>=0.20

  # Deep time support
  - cftime>=1.6

  # Cloud storage and data formats
  - zarr>=2.16,<3.0
  - h5netcdf>=1.1
  - netcdf4>=1.6
  - s3fs>=2023.6
  - gcsfs>=2023.6
  - fsspec>=2023.6

  # STAC
  - pystac>=1.9
  - pystac-client>=0.6
  - requests>=2.28

  # Visualization
  - matplotlib>=3.5
  - hvplot>=0.8
  - holoviews>=1.17

  # Development tools
  - pytest>=7.0
  - pytest-cov>=4.0
  - pytest-xdist>=3.0
  - mypy>=1.0
  - black>=23.0
  - pre-commit>=3.0
  - ipython>=8.0

  # Documentation
  - sphinx>=7.0
  - sphinx_rtd_theme>=1.3
  - numpydoc>=1.6

  # Pip-installed extras (optional)
  - pip:
    - ruff>=0.1